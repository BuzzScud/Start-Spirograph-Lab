<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spirograph · Mon 14 Sep</title>
<style>
:root{--bg:#0b0c10;--surface:#12131a;--border:rgba(240,238,230,.09);--ink:#f3f1ea;--ink2:#c7c5bb;--muted:#84837c;--faint:#5b5a55;--violet:#a78bfa;--mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans)}
.wrap{max-width:1720px;margin:0 auto;padding:18px 20px 26px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
header h1{margin:0;font:650 20px/1.2 var(--sans);letter-spacing:-.01em}
header p{margin:5px 0 0;color:var(--muted);font-size:13.5px;max-width:1200px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;height:clamp(374px,calc((100vh - 430px) * .85),833px)}
.sheet{position:relative;min-height:0;overflow:hidden}
.sheet canvas,.strip canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.rail{padding:16px 18px 13px;min-width:0;min-height:0;overflow:hidden}
.railIn{display:flex;flex-direction:column;gap:12px;transform-origin:0 0}.why{margin:0;color:var(--muted);font-size:11px;line-height:1.45}
.why b{color:var(--ink2);font-weight:600}
.clock b{display:block;font:650 42px/1 var(--mono);letter-spacing:-.02em}
.clock span{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.day{height:6px;border-radius:3px;background:#1c1e27;overflow:hidden}
.day i{display:block;height:100%;width:0;background:var(--violet)}
.lbl{color:var(--muted);font-size:12.5px}
.note{min-height:1.3em;color:var(--ink2);font-size:13.5px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13.5px;color:var(--ink2)}
.kv b{font:650 14px/1.2 var(--mono);color:var(--ink);text-align:right;white-space:nowrap}
.kv b.up{color:#6fcf97}.kv b.dn{color:#eb7b7b}
h5{margin:2px 0 0;font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:10px 36px minmax(0,1fr) 58px 74px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border-bottom:0}
.row .dot{width:10px;height:10px;border-radius:50%}
.row .nm{font:650 14px/1.1 var(--mono);color:var(--ink)}
.row .tn{font:500 12px/1 var(--mono);color:var(--muted);text-align:right}
.row .sz{font:650 14px/1 var(--mono);color:var(--ink);text-align:right;white-space:nowrap}
.row .lap{height:4px;border-radius:2px;background:#1c1e27;position:relative;overflow:hidden}
.row .lap i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 14px}
.play{width:42px;height:34px;border-radius:9px;border:1px solid rgba(167,139,250,.5);background:rgba(167,139,250,.16);color:var(--ink);cursor:pointer;font:600 15px/1 var(--sans)}
.play:focus-visible,.seg button:focus-visible,.scrub:focus-visible{outline:2px solid rgba(167,139,250,.7);outline-offset:2px}
.grp{display:inline-flex;align-items:center;gap:8px}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;border:1px solid var(--border);background:rgba(0,0,0,.22)}
.seg button{height:28px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:600 12.5px/1 var(--sans);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button.on{background:rgba(167,139,250,.16);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(167,139,250,.4)}
.scrub{flex:1 1 280px;min-width:180px;accent-color:#a78bfa}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;cursor:pointer}
.strip{position:relative;height:220px}
.legend{position:absolute;left:62px;top:10px;display:flex;gap:16px;font-size:12.5px;color:var(--ink2);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:18px;height:2px;border-radius:1px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:rgba(18,19,26,.96);border:1px solid rgba(240,238,230,.14);border-radius:8px;padding:6px 9px;font:500 12.5px/1.5 var(--mono);color:var(--ink2);display:none;white-space:nowrap}
.tip b{color:var(--ink)}
.foot{margin:0;color:var(--faint);font-size:12px;max-width:1200px}
@media (max-width:1100px){.stage{grid-template-columns:1fr;height:auto}.sheet{height:61.2vw;min-height:323px}.rail{overflow:visible}}
</style>
</head>

<script>
(() => {
  const TAU = Math.PI * 2, F = D.frames, N = F.pen.length - 1, L = D.periods.length, W = D.periods.map(p => -TAU / p);
  const BG = '#0b0c10', INK = '#f3f1ea', INK2 = '#c7c5bb', MUTED = '#84837c', GRID = '#1f2129';
  const lift = (hex, t) => { const v = parseInt(hex.slice(1), 16), m = c => Math.round(c + (255 - c) * t); return `rgb(${m(v >> 16)},${m((v >> 8) & 255)},${m(v & 255)})`; };
  const COL = D.colors, TXT = COL.map(c => lift(c, .25)), PEN = lift(COL[L - 1], .25);
  const $ = id => document.getElementById(id);
  const st = { s: 0, playing: false, speed: 60, mode: 'refit', view: 'whole', trail: true, last: 0, hover: null, dirty: true };

  // ---------------------------------------------------------------- the data at any moment (s = minutes since Sunday 6 pm)
  const lerp = (arr, s) => { const k = Math.max(0, Math.min(N - 1, Math.floor(s))), f = Math.max(0, Math.min(1, s - k)); return arr[k] + (arr[k + 1] - arr[k]) * f; };
  const aAt = s => { if (st.mode === 'held') return D.held.A; const k = Math.max(0, Math.min(N - 1, Math.floor(s))), f = s - k, a = F.A[k], b = F.A[k + 1]; return a.map((v, n) => v + (b[n] - v) * f); };
  const penAt = s => lerp(st.mode === 'held' ? D.held.pen : F.pen, s);
  const mktAt = s => { let k = Math.min(N, Math.floor(s)); while (k >= 0 && F.mkt[k] == null) k--; return k >= 0 ? F.mkt[k] : null; };
  // NESTED: each circle is half the one it rides on and centred on its rim, its arm at speed × minutes since 6 pm - the
  // 1D once round from 6 pm to 6 pm, the 4H six times round the 1D's rim, and so on down. The fitted ±pts are the numbers.
  const RAD = D.periods.map((_, n) => 0.5 ** n);
  function chain(s) {
    const out = []; let x = 0, y = 0;
    for (let n = 0; n < L; n++) { const th = W[n] * s, cx = x, cy = y; x += RAD[n] * Math.cos(th); y += RAD[n] * Math.sin(th); out.push({ cx, cy, x, y, r: RAD[n] }); }
    return out;
  }

  // ---------------------------------------------------------------- formatting
  const etTime = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
  const etDay = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/New_York', weekday: 'short', day: 'numeric', month: 'short' });
  const msAt = s => D.T0 + s * 60000;
  const clock = s => etTime.format(msAt(s)).replace(' AM', ' am').replace(' PM', ' pm');
  const px2 = v => v == null ? '—' : v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sgn = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}`;
  const niceStep = x => { const p = 10 ** Math.floor(Math.log10(x)), f = x / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; };
  function fit(cv) {
    const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, w, h };
  }
  const halo = (ctx, t, x, y) => { ctx.lineWidth = 3; ctx.strokeStyle = BG; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); ctx.fillText(t, x, y); };

  // ---------------------------------------------------------------- the sheet
  function drawSheet() {
    const cv = $('sheet'), { ctx, w, h } = fit(cv); ctx.clearRect(0, 0, w, h);
    const s = st.s, A = aAt(s), ch = chain(s), pen = ch[L - 1];
    const fast = st.view === 'fast', R = RAD.slice(fast ? 3 : 0).reduce((a, b) => a + b, 0);
    const ox = fast ? ch[3].cx : 0, oy = fast ? ch[3].cy : 0, p = Math.min(w, h) / 2 / (R * 1.1);
    const X = v => w / 2 + (v - ox) * p, Y = v => h / 2 - (v - oy) * p;
    // grid in points, the axes through the base
    const step = niceStep(70 / p), xs = (0 - w / 2) / p + ox, xe = (w / 2) / p + ox, ys = oy - (h / 2) / p, ye = oy + (h / 2) / p;
    ctx.beginPath();
    for (let v = Math.ceil(xs / step) * step; v <= xe; v += step) { const x = Math.round(X(v)) + .5; ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    for (let v = Math.ceil(ys / step) * step; v <= ye; v += step) { const y = Math.round(Y(v)) + .5; ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.strokeStyle = GRID; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); const ax = Math.round(X(0)) + .5, ay = Math.round(Y(0)) + .5;
    if (ax > 0 && ax < w) { ctx.moveTo(ax, 0); ctx.lineTo(ax, h); } if (ay > 0 && ay < h) { ctx.moveTo(0, ay); ctx.lineTo(w, ay); }
    ctx.strokeStyle = 'rgba(132,131,124,.45)'; ctx.stroke();
    ctx.font = '500 11.5px ' + getComputedStyle(document.body).getPropertyValue('--mono');
    // the pen's trail: its rosette over the last two hours (one turn of the 2H), fading in toward now
    if (st.trail && s > 0.5) {
      const from = Math.max(0, s - 120);
      let prev = null;
      for (let j = 0; j <= 480; j++) {
        const t = from + (s - from) * j / 480, q = chain(t)[L - 1], pt = [X(q.x), Y(q.y)];
        if (prev) { const u = j / 480; ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(pt[0], pt[1]); ctx.strokeStyle = PEN; ctx.globalAlpha = .05 + .75 * u ** 2; ctx.lineWidth = 1 + u; ctx.stroke(); }
        prev = pt;
      }
      ctx.globalAlpha = 1;
    }
    // the circles: each centred on the tip of the arm before it, its radius its size, its arm at speed × minutes since 6 pm
    for (let n = 0; n < L; n++) {
      const c = ch[n], cx = X(c.cx), cy = Y(c.cy), r = c.r * p, dim = fast && n < 3 ? .25 : 1;
      ctx.globalAlpha = dim;
      if (r >= .6) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.strokeStyle = COL[n]; ctx.lineWidth = 1.4; ctx.stroke(); }
      if (r >= 3) { const sx = cx + r; ctx.beginPath(); ctx.moveTo(sx - 5, cy); ctx.lineTo(sx + 5, cy); ctx.lineWidth = 2; ctx.strokeStyle = COL[n]; ctx.stroke(); }   // where the arm points at 6 pm
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(X(c.x), Y(c.y)); ctx.strokeStyle = COL[n]; ctx.globalAlpha = .7 * dim; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.globalAlpha = dim; ctx.beginPath(); ctx.arc(X(c.x), Y(c.y), 2, 0, TAU); ctx.fillStyle = COL[n]; ctx.fill();
      // only circles with room get a name: the small ones ride at the big ones' tops, where names collide; the rail names all six
      if (r >= 60) { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = TXT[n]; halo(ctx, `${D.labels[n][0]} ${A[n] < 0 ? '▲' : '▼'} ±${Math.abs(A[n]).toFixed(1)}`, cx, cy - r - 6); }
    }
    ctx.globalAlpha = 1;
    // the pen, and how far the market is from the pen's price (the drawing's height is not price: the circles are nested)
    const px = X(pen.x), py = Y(pen.y), m = mktAt(s);
    if (m != null) {
      const gap = m - penAt(s); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = INK; ctx.font = '650 13px ' + getComputedStyle(document.body).getPropertyValue('--mono');
      halo(ctx, `market ${sgn(gap)} vs pen`, 14, 14);   // in the corner: beside the pen it sat on the small circles
    }
    ctx.beginPath(); ctx.arc(px, py, 3.5, 0, TAU); ctx.fillStyle = INK; ctx.fill();
    ctx.beginPath(); ctx.arc(px, py, 6.5, 0, TAU); ctx.strokeStyle = PEN; ctx.lineWidth = 1.6; ctx.stroke();
  }

  // ---------------------------------------------------------------- the day strip: market and pen, one axis
  let yLo = Infinity, yHi = -Infinity;
  for (const arr of [F.mkt, F.pen, D.held.pen]) for (const v of arr) if (v != null) { yLo = Math.min(yLo, v); yHi = Math.max(yHi, v); }
  const pad = (yHi - yLo) * .08; yLo -= pad; yHi += pad;
  const SL = 62, SR = 16, ST = 34, SB = 26;
  function drawStrip() {
    const cv = $('strip'), { ctx, w, h } = fit(cv); ctx.clearRect(0, 0, w, h);
    const X = s => SL + (w - SL - SR) * s / N, Y = v => ST + (h - ST - SB) * (1 - (v - yLo) / (yHi - yLo));
    ctx.fillStyle = 'rgba(240,238,230,.035)'; ctx.fillRect(X(1380), ST, X(N) - X(1380), h - ST - SB);   // the 5–6 pm break
    const mono = getComputedStyle(document.body).getPropertyValue('--mono');
    ctx.font = '500 11.5px ' + mono; ctx.fillStyle = MUTED;
    const step = niceStep((yHi - yLo) / 4);
    ctx.beginPath(); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let v = Math.ceil(yLo / step) * step; v <= yHi; v += step) { const y = Math.round(Y(v)) + .5; ctx.moveTo(SL, y); ctx.lineTo(w - SR, y); ctx.fillText(v.toLocaleString('en-US'), SL - 8, y); }
    ctx.strokeStyle = GRID; ctx.lineWidth = 1; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let s = 0; s <= N; s += 180) { const x = X(s); ctx.fillText(clock(s), Math.max(SL + 16, Math.min(w - SR - 16, x)), h - SB + 7); ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, h - SB); ctx.lineTo(Math.round(x) + .5, h - SB + 4); ctx.strokeStyle = MUTED; ctx.stroke(); }
    ctx.textAlign = 'right'; ctx.fillText('break', X(N) - 4, ST + 4);
    const line = (arr, col, width, until, after) => {
      for (const [a, b, al] of [[0, until, 1], [until, N, after]]) {
        if (b <= a) continue; ctx.beginPath(); let on = false;
        for (let k = Math.floor(a); k <= Math.min(N, Math.ceil(b)); k++) { const v = arr[k]; if (v == null) { on = false; continue; } const x = X(k), y = Y(v); if (on) ctx.lineTo(x, y); else ctx.moveTo(x, y); on = true; }
        ctx.strokeStyle = col; ctx.globalAlpha = al; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.stroke(); ctx.globalAlpha = 1;
      }
    };
    const penArr = st.mode === 'held' ? D.held.pen : F.pen;
    line(F.mkt, INK, 1.5, st.s, .28);
    line(penArr, PEN, 2, st.s, .3);
    // now
    const x = X(st.s); ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, ST - 6); ctx.lineTo(Math.round(x) + .5, h - SB); ctx.strokeStyle = 'rgba(167,139,250,.8)'; ctx.lineWidth = 1; ctx.stroke();
    const m = mktAt(st.s), pv = penAt(st.s);
    for (const [v, col] of [[pv, PEN], [m, INK]]) if (v != null) { ctx.beginPath(); ctx.arc(x, Y(v), 4, 0, TAU); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = BG; ctx.stroke(); }
    // hover
    const hv = st.hover;
    const tip = $('tip');
    if (hv != null) {
      const hx = X(hv), k = Math.round(hv), mv = mktAt(k), pvv = penArr[k];
      ctx.beginPath(); ctx.moveTo(Math.round(hx) + .5, ST); ctx.lineTo(Math.round(hx) + .5, h - SB); ctx.strokeStyle = 'rgba(240,238,230,.35)'; ctx.stroke();
      tip.innerHTML = `<b>${clock(k)}</b> ET<br>market <b>${px2(mv)}</b><br>pen <b>${px2(pvv)}</b>${mv != null ? `<br>gap <b>${sgn(mv - pvv)}</b>` : ''}`;
      tip.style.display = 'block';
      const tw = tip.offsetWidth; tip.style.left = Math.min(w - tw - 8, hx + 12) + 'px'; tip.style.top = (ST + 6) + 'px';
    } else tip.style.display = 'none';
  }
  const strip = $('strip');
  const sOfEvent = e => { const b = strip.getBoundingClientRect(), x = e.clientX - b.left; return Math.max(0, Math.min(N, (x - SL) / (b.width - SL - SR) * N)); };
  let dragging = false;
  strip.addEventListener('pointermove', e => { st.hover = sOfEvent(e); if (dragging) seek(st.hover); st.dirty = true; });
  strip.addEventListener('pointerleave', () => { st.hover = null; st.dirty = true; });
  strip.addEventListener('pointerdown', e => { dragging = true; strip.setPointerCapture(e.pointerId); seek(sOfEvent(e)); });
  strip.addEventListener('pointerup', () => { dragging = false; });

  // ---------------------------------------------------------------- the rail
  const rows = $('rows');
  rows.innerHTML = D.labels.map((l, n) => `<div class="row" title="The ${l[0]} circle, ≈ ${l[1]} bars a turn"><i class="dot" style="background:${COL[n]}"></i><span class="nm">${l[0]}</span><span class="lap"><i data-lap="${n}" style="background:${COL[n]}"></i></span><span class="tn" data-turn="${n}"></span><span class="sz" data-sz="${n}"></span></div>`).join('');
  const q = sel => [...rows.querySelectorAll(sel)];
  const szEl = q('[data-sz]'), lapEl = q('[data-lap]'), turnEl = q('[data-turn]');
  function drawRail() {
    const s = st.s, A = aAt(s), m = mktAt(s), pv = penAt(s), ms = msAt(s);
    $('clk').textContent = clock(s);
    $('clkDay').textContent = `${etDay.format(ms)} · New York time`;
    $('dayBar').style.width = `${(100 * s / N).toFixed(2)}%`;
    $('dayTxt').textContent = `day ${Math.min(99, Math.floor(100 * s / N))}% since Sunday 6 pm`;
    $('note').textContent = s >= 1380 ? 'break · the circles keep turning · reopens 6 pm' : s < 1 ? 'the Sunday open: every arm at its start' : m == null ? 'no trade this minute' : '';
    const gap = m == null ? null : m - pv;
    $('px').innerHTML = `<span>Market</span><b>${px2(m)}</b><span>Pen (${st.mode === 'held' ? 'held from 6 pm' : 'refit'})</span><b>${px2(pv)}</b><span>Market − pen</span><b class="${gap == null ? '' : gap >= 0 ? 'up' : 'dn'}">${gap == null ? '—' : sgn(gap)}</b>`;
    for (let n = 0; n < L; n++) {
      const P = D.periods[n], frac = (s % P) / P, turns = Math.round(N / P);
      szEl[n].textContent = `${A[n] < 0 ? '▲' : '▼'} ±${Math.abs(A[n]).toFixed(1)}`;
      lapEl[n].style.width = `${(frac * 100).toFixed(1)}%`;
      turnEl[n].textContent = `${Math.min(turns, Math.floor(s / P) + 1)}/${turns}`;
    }
    const k = Math.round(s), e = F.expl[k], r = F.rms[k];
    $('score').innerHTML = SCORE + `<span>Held-out explains now</span><b>${e == null ? '—' : Math.round(e * 100) + '%'}</b><span>Held-out resid now</span><b>${r == null ? '—' : '±' + r.toFixed(1)}</b>`;
  }
  // the day as a whole: the root-mean-square miss of each pen against the market, beside two flat lines - Friday's close,
  // which is all the held pen knew at 6 pm, and the first print after 6 pm, which already knows the weekend's gap
  const rms = pick => { let ss = 0, c = 0; for (let k = 0; k <= N; k++) { const m = F.mkt[k]; if (m == null) continue; const e = m - pick(k); ss += e * e; c++; } return Math.sqrt(ss / c); };
  const first = F.mkt.find(v => v != null), O = D.open, fmtI = v => Math.round(v).toLocaleString('en-US');
  const SCORE = `<span>Held pen's miss</span><b>±${rms(k => D.held.pen[k]).toFixed(1)}</b><span>Flat at Friday's close</span><b>±${rms(() => O.prevClose).toFixed(1)}</b>`
    + `<span>Flat at the first print</span><b>±${rms(() => first).toFixed(1)}</b><span>Refit pen's miss</span><b>±${rms(k => F.pen[k]).toFixed(1)}</b>`;
  const trendW = O.drift * O.weekendMin, gapW = first - O.prevClose;
  $('why').innerHTML = `At 6 pm Sunday the pen stood at <b>${fmtI(D.held.pen[0])}</b>: Friday's close ${fmtI(O.prevClose)}, plus the fit's trend of ${O.drift >= 0 ? '+' : '−'}${Math.abs(O.drift).toFixed(3)} pts a minute carried through the ${Math.round(O.weekendMin / 60)}-hour weekend (<b>${trendW >= 0 ? '+' : '−'}${fmtI(Math.abs(trendW))}</b>), and the cycles. `
    + `The market opened at <b>${fmtI(first)}</b>, ${fmtI(Math.abs(gapW))} ${gapW < 0 ? 'below' : 'above'} Friday's close: a gap nothing fitted on Friday could know. The trend running through the weekend is the engine's doing, and fixable: it should count only the minutes Globex trades. The refit pen has seen every close up to each minute, so its miss is not a forecast.`;

  // ---------------------------------------------------------------- controls and the clock
  function seek(s) { st.s = Math.max(0, Math.min(N, s)); $('scrub').value = Math.round(st.s); st.dirty = true; }
  function setPlaying(on) { st.playing = on; if (on && st.s >= N) st.s = 0; $('play').textContent = on ? '❚❚' : '▶'; $('play').setAttribute('aria-label', on ? 'Pause' : 'Play'); st.last = 0; }
  $('play').addEventListener('click', () => setPlaying(!st.playing));
  $('scrub').addEventListener('input', e => { seek(+e.target.value); });
  const seg = (id, key, parse = v => v) => {
    const el = $(id), paint = () => { for (const b of el.children) b.classList.toggle('on', parse(b.dataset.v) === st[key]); };
    el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st[key] = parse(b.dataset.v); paint(); st.dirty = true; });
    paint();
  };
  seg('speed', 'speed', Number); seg('mode', 'mode'); seg('view', 'view');
  $('trail').addEventListener('change', e => { st.trail = e.target.checked; st.dirty = true; });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'range' && e.key !== ' ') return;
    if (e.key === ' ') { e.preventDefault(); setPlaying(!st.playing); }
    else if (e.key === 'ArrowRight') seek(st.s + (e.shiftKey ? 15 : 1));
    else if (e.key === 'ArrowLeft') seek(st.s - (e.shiftKey ? 15 : 1));
  });
  new ResizeObserver(() => { st.dirty = true; }).observe(document.body);
  $('legend').innerHTML = `<span><i style="background:${INK}"></i>market (NQZ6 closes)</span><span><i style="background:${PEN}"></i>pen</span>`;
  $('sub').textContent = `${D.contract} · real one-minute bars (${D.bars.day.toLocaleString('en-US')} on the day) · the Ladder's own Daily set engine replayed a minute at a time · Sunday 13 Sep 6 pm → Monday 14 Sep 6 pm. The circles are nested: the blue 1D turns once from 6 pm to 6 pm, the orange 4H rides round its rim six times, and each smaller circle, half the one above, rides the one before it. Their fitted ±pts are the numbers. Space plays, ← → step a minute (⇧ 15).`;
  $('foot').textContent = `"Refit each minute" is what the Spirograph would have shown live: each minute the circles were refitted to every close up to it, so its pen has seen the market it is measured against. "Held from 6 pm" keeps Sunday 6 pm's circles all day, which is a real forward test; the flat line is the first close after 6 pm held all day, the no-skill yardstick. Built ${D.made.slice(0, 10)} from src/sim.js, dayClock.js and dailySet.js.`;
  function loop(ts) {
    if (st.playing) {
      const dt = st.last ? Math.min(.1, (ts - st.last) / 1000) : 0; st.last = ts;
      st.s = Math.min(N, st.s + dt * N / st.speed); $('scrub').value = Math.round(st.s);
      if (st.s >= N) setPlaying(false);
      st.dirty = true;
    }
    if (st.dirty) { st.dirty = false; drawSheet(); drawStrip(); drawRail(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
// Fit the rail to its box so nothing needs a scroll: shrink the note first,
// then scale the whole rail if the window is still too short.
(function () {
  const rail = document.getElementById('rail'), inn = document.getElementById('railIn'), why = document.getElementById('why');
  let queued = false;
  function fit() {
    queued = false;
    inn.style.transform = ''; inn.style.width = ''; why.style.fontSize = '';
    for (let s = 11; s >= 9.5; s -= 0.5) {
      why.style.fontSize = s + 'px';
      if (rail.scrollHeight <= rail.clientHeight) return;
    }
    const cs = getComputedStyle(rail);
    const avail = rail.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    // Scale down, widening the inner box by 1/scale so lines wrap as they
    // will look; wider lines mean fewer of them, so settle in a few passes.
    let k = 1;
    for (let i = 0; i < 4; i++) {
      inn.style.width = (100 / k) + '%';
      k = Math.max(0.5, Math.min(1, Math.floor(avail / inn.offsetHeight * 200) / 200));
    }
    inn.style.width = (100 / k) + '%';
    while (k > 0.5 && inn.offsetHeight * k > avail) { k -= 0.005; inn.style.width = (100 / k) + '%'; }
    inn.style.transform = `scale(${k})`;
  }
  const queue = () => { if (!queued) { queued = true; requestAnimationFrame(fit); } };
  new ResizeObserver(queue).observe(rail);
  new MutationObserver(queue).observe(inn, { childList: true, subtree: true, characterData: true });
  addEventListener('resize', queue);
  queue();
})();
</script>
</body>
</html>
